<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRT Retro</title>
<link rel="icon" href="icono.png">
<meta property="og:title" content="CRT Retro"><meta property="og:description" content="Convertí tus fotos y videos en pantalla de tubo: ámbar, verde, azul y más.">
<meta property="og:type" content="website"><meta property="og:url" content="https://cristianivanich.github.io/crt/">
<meta property="og:image" content="https://cristianivanich.github.io/crt/card.jpg">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:site" content="@de_carazaa">
<meta name="twitter:image" content="https://cristianivanich.github.io/crt/card.jpg">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--c:#ffb000;--cl:#ffd36b}
body{margin:0;min-height:100vh;background:#0a0703;color:var(--c);font:26px "VT323","Courier New",monospace;display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 12px;text-shadow:0 0 6px var(--c)}
h1{margin:0;font-weight:normal;font-size:44px;letter-spacing:.15em;color:var(--cl)}
.pantalla{position:relative;width:min(100%,760px);min-height:260px;background:#080808;border:8px solid #17130c;border-radius:18px;overflow:hidden;display:grid;place-items:center;box-shadow:inset 0 0 60px #000,0 0 40px rgba(255,255,255,.06)}
.pantalla img,.pantalla video{display:block;width:100%;filter:var(--f)}
.pantalla::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--ov)}
.v{color:var(--c);opacity:.55;text-shadow:none;padding:20px;text-align:center}
button,label{font:inherit;color:var(--c);background:#111;border:2px solid var(--c);padding:4px 16px;cursor:pointer;text-shadow:inherit}
button:hover,label:hover,.on{background:var(--c);color:#080808;text-shadow:none}
.f{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style></head><body>
<h1>CRT RETRO</h1>
<div class="f" id="t"></div>
<div class="pantalla" id="p"><div class="v">&gt; ELEGÍ UNA FOTO O UN VIDEO<span id="c">_</span></div></div>
<div class="f">
<label>ELEGIR ARCHIVO<input id="a" type="file" accept="image/*,video/*" hidden></label>
<button id="d" hidden>DESCARGAR FOTO</button>
<button id="dv" hidden>DESCARGAR VIDEO</button>
</div>
<div class="v" style="padding:0">Para bajar el video, dejá la pestaña abierta: se graba mientras se reproduce.</div>
<script>
var LINEAS="repeating-linear-gradient(to bottom,rgba(0,0,0,.3) 0,rgba(0,0,0,.3) 1px,transparent 1px,transparent 3px),";
var BASE="grayscale(1) sepia(1) saturate(3.4) brightness(1.0) contrast(1.12) blur(.4px) ";
var VIG=LINEAS+"radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6) 100%)";
var T=[
 {n:"ÁMBAR",c:"#ffb000",cl:"#ffd36b",f:BASE+"hue-rotate(-12deg) drop-shadow(0 0 3px rgba(255,160,0,.8))",ov:VIG,sc:.34,vg:.65},
 {n:"VERDE",c:"#33ff55",cl:"#a5ffb5",f:BASE+"hue-rotate(78deg) drop-shadow(0 0 3px rgba(50,255,90,.8))",ov:VIG,sc:.34,vg:.65},
 {n:"AZUL",c:"#4db8ff",cl:"#b3e0ff",f:BASE+"hue-rotate(158deg) drop-shadow(0 0 3px rgba(60,170,255,.8))",ov:VIG,sc:.34,vg:.65},
 {n:"ROJO",c:"#ff4a30",cl:"#ff9a8a",f:BASE+"hue-rotate(-38deg) drop-shadow(0 0 3px rgba(255,70,40,.8))",ov:VIG,sc:.34,vg:.65},
 {n:"BLANCO",c:"#f2f4f8",cl:"#ffffff",f:"grayscale(1) brightness(1.0) contrast(1.0) blur(.5px) drop-shadow(0 0 4px rgba(255,255,255,.7))",
  ov:"repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 1px,transparent 1px,transparent 3px),radial-gradient(circle at center,rgba(255,255,255,.16) 0,rgba(255,255,255,.06) 35%,rgba(0,0,0,.55) 75%,#000 100%)",sc:.18,vg:.85,fr:1}
];
var dv=document.getElementById("dv"),vid=null,grabando=false;
var p=document.getElementById("p"),d=document.getElementById("d"),img=null,cur=T[0],bar=document.getElementById("t");
function tema(i){cur=T[i];var s=document.documentElement.style;s.setProperty("--c",cur.c);s.setProperty("--cl",cur.cl);p.style.setProperty("--f",cur.f);p.style.setProperty("--ov","url("+overlayCanvas(800,600).toDataURL()+") center/100% 100%");
 [].forEach.call(bar.children,function(b,j){b.className=j==i?"on":""})}
T.forEach(function(t,i){var b=document.createElement("button");b.textContent=t.n;b.onclick=function(){tema(i)};bar.appendChild(b)});
tema(0);
setInterval(function(){var c=document.getElementById("c");if(c)c.style.opacity=c.style.opacity=="0"?1:0},500);
document.getElementById("a").onchange=function(e){
 var f=e.target.files[0];if(!f)return;var u=URL.createObjectURL(f);p.textContent="";d.hidden=true;dv.hidden=true;
 if(f.type.indexOf("video")==0){var v=document.createElement("video");v.src=u;v.controls=true;v.loop=true;v.muted=true;v.autoplay=true;v.playsInline=true;p.appendChild(v);vid=v;dv.hidden=false}
 else{img=new Image();img.onload=function(){d.hidden=false};img.src=u;p.appendChild(img)}
};
d.onclick=function(){
 var w=img.naturalWidth,h=img.naturalHeight,c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");
 x.filter=cur.f;x.drawImage(img,0,0,w,h);x.filter="none";
 x.drawImage(overlayCanvas(w,h),0,0);
 var a=document.createElement("a");a.download="crt-"+cur.n.toLowerCase()+".png";a.href=c.toDataURL("image/png");a.click();
};

function overlayCanvas(w,h){var o=document.createElement("canvas");o.width=w;o.height=h;var x=o.getContext("2d");
 var sd=7;function R(){sd=(sd*16807)%2147483647;return sd/2147483647}
 var m=Math.max(w,h),i;
 /* manchas de desgaste: zonas mas apagadas y otras mas brillantes */
 for(i=0;i<9;i++){var cx=R()*w,cy=R()*h,r=m*(.15+R()*.3),dk=i%3?1:0,gr=x.createRadialGradient(cx,cy,0,cx,cy,r);
  gr.addColorStop(0,dk?"rgba(0,0,0,"+(.06+R()*.1)+")":"rgba(255,255,255,"+(.015+R()*.03)+")");gr.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=gr;x.fillRect(0,0,w,h)}
 /* lineas de barrido */
 var s=Math.max(1,Math.round(h/260));x.fillStyle="rgba(0,0,0,"+cur.sc+")";for(var y=0;y<h;y+=3*s)x.fillRect(0,y,w,s);
 /* grano */
 var im=x.getImageData(0,0,w,h),d=im.data,p;for(p=0;p<d.length;p+=4){var n=R();if(n<.5){var a=Math.floor(R()*14);d[p+3]=Math.min(255,d[p+3]+a);if(n<.03){d[p]=d[p+1]=d[p+2]=255;d[p+3]=Math.min(255,d[p+3]+6)}}}
 x.putImageData(im,0,0);
 /* polvo y rayitas */
 for(i=0;i<45;i++){x.fillStyle="rgba(255,255,255,"+(.06+R()*.12)+")";x.fillRect(R()*w,R()*h,1+R()*2*s,1+R()*2*s)}
 for(i=0;i<5;i++){x.strokeStyle="rgba(255,255,255,.06)";x.lineWidth=s;x.beginPath();var px=R()*w,py=R()*h;x.moveTo(px,py);x.lineTo(px+(R()-.5)*m*.2,py+(R()-.5)*m*.2);x.stroke()}
 /* viñeta (brillo al centro, bordes oscuros) */
 var g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,m*.72);
 if(cur.fr){g.addColorStop(0,"rgba(255,255,255,.16)");g.addColorStop(.35,"rgba(255,255,255,.05)");g.addColorStop(.72,"rgba(0,0,0,.6)");g.addColorStop(1,"#000")}
 else{g.addColorStop(.25,"rgba(0,0,0,0)");g.addColorStop(.7,"rgba(0,0,0,"+(cur.vg*.7)+")");g.addColorStop(1,"rgba(0,0,0,"+Math.min(1,cur.vg+.2)+")")}
 x.fillStyle=g;x.fillRect(0,0,w,h);return o}
dv.onclick=function(){
 if(grabando||!vid)return;var v=vid;
 if(!window.MediaRecorder){alert("Este navegador no puede grabar video.");return}
 var k=Math.min(1,1280/v.videoWidth),w=Math.round(v.videoWidth*k)&~1,h=Math.round(v.videoHeight*k)&~1;
 var c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d"),ov=overlayCanvas(w,h),f=cur.f,nom=cur.n.toLowerCase();
 var st=c.captureStream(30),ac=null;
 try{ac=new (window.AudioContext||window.webkitAudioContext)();var src=ac.createMediaElementSource(v),dst=ac.createMediaStreamDestination();src.connect(dst);dst.stream.getAudioTracks().forEach(function(t){st.addTrack(t)})}catch(e){ac=null}
 var tipo=["video/mp4","video/webm;codecs=vp9,opus","video/webm"].filter(function(t){return MediaRecorder.isTypeSupported(t)})[0]||"";
 var rec=new MediaRecorder(st,tipo?{mimeType:tipo,videoBitsPerSecond:4000000}:{}),partes=[];
 rec.ondataavailable=function(e){if(e.data.size)partes.push(e.data)};
 rec.onstop=function(){grabando=false;v.loop=true;v.controls=true;dv.textContent="DESCARGAR VIDEO";
  var ext=(rec.mimeType||tipo).indexOf("mp4")>=0?"mp4":"webm",a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(partes,{type:rec.mimeType||tipo}));a.download="crt-"+nom+"."+ext;a.click()};
 function dibujar(){if(!grabando)return;x.filter=f;x.drawImage(v,0,0,w,h);x.filter="none";x.drawImage(ov,0,0);
  if(v.duration)dv.textContent="GRABANDO "+Math.round(100*v.currentTime/v.duration)+"%";requestAnimationFrame(dibujar)}
 grabando=true;v.loop=false;v.controls=false;v.muted=false;v.currentTime=0;
 v.onended=function(){if(grabando){grabando=false;rec.stop()}};
 if(ac&&ac.state=="suspended")ac.resume();
 rec.start(500);v.play().then(dibujar);
};
</script></body></html>
